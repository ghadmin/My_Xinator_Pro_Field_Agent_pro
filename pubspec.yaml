name: xinator_fsm_pro
description: "A new Flutter project."

publish_to: "none"
version: 1.0.5+5

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dotted_border: ^3.1.0
  get: ^4.6.6
  logger: ^2.5.0
  dio: ^5.7.0
  flutter_screenutil: ^5.9.3
  http: ^1.2.2
  shared_preferences: ^2.3.4
  change_app_package_name: ^1.4.0
  iconly: ^1.0.1
  iconsax: ^0.0.8
  expandable_text: ^2.3.0
  file_picker: ^10.0.0
  lottie: ^3.3.0
  ionicons: ^0.2.2
  flutter_native_splash: ^2.4.3
  rename_app: ^1.6.1
  carousel_slider: ^5.0.0
  cached_network_image: ^3.4.1
  intl: ^0.20.1
  animated_text_kit: ^4.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.1
  image_picker: ^1.1.2
  image_cropper: ^9.0.0
  pretty_dio_logger: ^1.4.0
  remixicon: ^1.3.0
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  dropdown_button2: ^2.3.9
  mime: ^2.0.0
  webview_flutter: ^4.11.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  signature: ^6.3.0
  video_thumbnail: ^0.5.6
  video_player: ^2.10.0
  path_provider: ^2.1.5
  flutter_image_compress: ^2.4.0
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mockito:
  build_runner:
  hive_generator:
  pub_semver:

flutter_native_splash:
  color: "#FFFFFF"
  android: true
  ios: true
  web: false
  fullscreen: true
  android_12:
    color: "#FFFFFF"
    image: "assets/images/icon-splash/splash_icon.png"
    icon_background_color: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/icon-splash/
    - assets/images/onBoarding/
    - assets/images/loader_icon/
    - assets/images/side_bar/
    - assets/vectors/
    - assets/images/customers/
    - assets/fonts/
    - animations/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 900
